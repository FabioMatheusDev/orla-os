name: Home TV checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      # The runner image already has the Android SDK (ANDROID_HOME); setup-android now fails on it
      # (it asks for the removed 'tools' package and the Google TV add-on license).
      - name: Android SDK
        run: |
          echo "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'platforms;android-34' 'build-tools;34.0.0'
      - run: node --check app/src/main/assets/www/app.js
      - run: node tests/catalog.test.cjs
      - run: node --test tests/ports.test.cjs
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - run: python3 scripts/verify-apk.py
      - run: javac -encoding UTF-8 -d app/build/policy-check app/src/main/java/com/tvhome/launcher/CatalogPolicy.java tests/CatalogPolicyTest.java
      - run: java -cp app/build/policy-check com.tvhome.launcher.CatalogPolicyTest
      - run: javac -d app/build/policy-check app/src/main/java/com/tvhome/launcher/HomeWindowPolicy.java tests/HomeWindowPolicyTest.java
      - run: java -cp app/build/policy-check com.tvhome.launcher.HomeWindowPolicyTest
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chrome
      - run: node tests/browser.cjs
