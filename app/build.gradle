plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvhome.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvhome.launcher'
        minSdk 22          // Native API floor; actual UI support also depends on WebView.
        targetSdk 34
        versionCode 2
        versionName '1.1-byok'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Public release stays unsigned: each distributor supplies their own signing key.
        }
    }

    lint {
        // WRITE_SECURE_SETTINGS é concedida manualmente via ADB (pm grant).
        disable 'ProtectedPermissions'
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDirs = ["$buildDir/generated/publicAssets"] } }
}
tasks.register('preparePublicAssets', Exec) {
    commandLine 'node', file('../scripts/prepare-assets.cjs').absolutePath
    inputs.dir 'src/main/assets'
    inputs.file '../scripts/prepare-assets.cjs'
    outputs.dir "$buildDir/generated/publicAssets"
}
tasks.named('preBuild').configure { dependsOn 'preparePublicAssets' }
// Sem dependências externas: só o SDK do Android.
